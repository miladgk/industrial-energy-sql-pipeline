name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Compatibility testing: the same suite on several Python and PostgreSQL versions.
  # Python 3.11/3.12 on Postgres 15, plus Postgres 14 and 16 on Python 3.11.
  # (3.10 is not tested: the pinned FastAPI requires Python >= 3.11.)
  test:
    name: tests (py${{ matrix.python }} / pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", postgres: "15" }
          - { python: "3.12", postgres: "15" }
          - { python: "3.11", postgres: "14" }
          - { python: "3.11", postgres: "16" }

    env:
      # CI restores the snapshot published by main, which cannot yet contain a
      # dataset this pull request adds. The daily workflow syncs before it checks
      # and keeps this check strict.
      QUALITY_INFO_ONLY: "Datasets in the catalogue without any data"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: energy_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d energy_analytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx==0.28.1  # needed by FastAPI's TestClient

      - name: Create local config for CI
        run: |
          cat <<EOF > config.yaml
          database:
            host: 127.0.0.1
            port: 5432
            dbname: energy_analytics
            user: admin
            password: password
          EOF


      - name: Create the warehouse schema
        run: python src/setup_db.py

      # The real warehouse, as published by the daily refresh: a public release
      # asset, so CI needs no Fingrid key and pull requests see no secrets.
      - name: Restore the Fingrid warehouse snapshot
        run: |
          curl -fsSL --retry 3 -o /tmp/fingrid_observation.csv.gz \
            https://github.com/${{ github.repository }}/releases/download/warehouse-snapshot/fingrid_observation.csv.gz
          python src/warehouse_snapshot.py restore /tmp/fingrid_observation.csv.gz

      - name: Run data quality checks
        run: python src/run_quality_checks.py

      - name: Smoke tests (is everything alive?)
        run: pytest -m smoke -v

      - name: API contract tests
        run: pytest -m api -v

      - name: Integration tests
        run: pytest -m integration -v

      - name: Regression tests (golden datasets)
        run: pytest -m regression -v

      - name: Performance tests (query plans + latency budgets)
        run: pytest -m performance -v

      - name: Security tests
        run: pytest -m security -v

      - name: Run Full Pytest Suite
        run: |
          pytest tests/ -v

      # End-to-end: a real Chromium drives the dashboard against the real API + DB.
      - name: E2E tests (Playwright + Chromium)
        if: matrix.python == '3.11' && matrix.postgres == '15'
        run: |
          pip install playwright==1.61.0
          playwright install --with-deps chromium
          pytest -m e2e -v

      # Load testing: once is enough, so only on the primary matrix entry.
      - name: Load test (20 virtual users, 30 s)
        if: matrix.python == '3.11' && matrix.postgres == '15'
        run: |
          pip install locust
          uvicorn src.api:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          locust -f tests/load/locustfile.py --headless -u 20 -r 5 -t 30s --host http://localhost:8000

  # Security testing: static analysis of our code + known-CVE scan of dependencies.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit (fails on medium or high severity findings)
        run: bandit -r src scripts -ll

      - name: pip-audit (fails if a pinned dependency has a known CVE)
        run: pip-audit -r requirements.txt --no-deps --disable-pip
