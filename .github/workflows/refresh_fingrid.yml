name: Refresh the Fingrid warehouse and dashboard data

# Once a day:
#   1. start an empty PostgreSQL and restore yesterday's warehouse snapshot
#      (release "warehouse-snapshot", asset fingrid_observation.csv.gz)
#   2. sync from Fingrid: only the last 7 days per dataset (Fingrid revises
#      recent values); with no snapshot it backfills 400 days instead
#   3. publish the new snapshot, so the next run starts from it
#   4. run the SQL analyses and write docs/data/fingrid_recent_daily.json,
#      forecast_scorecard.json, co2_forecast.json and grid_events.json; commit
#      them if they changed and redeploy GitHub Pages
#
# It runs at 10:53 UTC because Fingrid publishes the next day's day-ahead
# forecasts at 12:00 Finnish time (10:00 UTC in winter, 09:00 UTC in summer),
# and the CO2 forecast for tomorrow is built from them.
#
# Requires the repository secret FINGRID_API_KEY
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# The key is only used inside this job; it is never written to the repository
# or sent to the browser.
#
# The newest values (updated every hour) come from pages.yml instead.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. The daily data commit normally counts as that
# activity; the keepalive job covers the case where the refresh keeps failing
# (for example an expired key), so the hourly and daily schedules stay on while
# the failure emails keep arriving.

on:
  schedule:
    - cron: "53 10 * * *"    # every day 10:53 UTC, after Fingrid's 12:00 Finnish-time publication
  workflow_dispatch:
    inputs:
      history_from:
        description: "Optional, YYYY-MM-DD: also fill older Fingrid history back to this date (one-off, about an hour)"
        required: false
        default: ""

permissions:
  contents: write            # commit the refreshed JSON and publish the snapshot release asset
  actions: write             # start the Pages deploy (pushes made with GITHUB_TOKEN do not trigger workflows)

concurrency:
  group: refresh-fingrid
  cancel-in-progress: false

env:
  SNAPSHOT_TAG: warehouse-snapshot
  SNAPSHOT_FILE: fingrid_observation.csv.gz
  FORECAST_ARCHIVE: weather_forecast.csv.gz
  HYDROLOGY_ARCHIVE: hydrology.csv.gz
  PRICE_ARCHIVE: entsoe_price.csv.gz

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full backfill (no snapshot) takes about 15 minutes; a one-off history fill (history_from) up to a few hours.
    timeout-minutes: ${{ inputs.history_from != '' && 240 || 45 }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: energy_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d energy_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/energy_analytics
      DATABASE_SSLMODE: disable
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check that the API key secret exists
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: |
          if [ -z "$FINGRID_API_KEY" ]; then
            echo "::error::Repository secret FINGRID_API_KEY is not set."
            exit 1
          fi

      - name: Create the schema
        run: python src/setup_db.py

      - name: Restore the previous warehouse snapshot
        run: |
          if gh release download "$SNAPSHOT_TAG" --pattern "$SNAPSHOT_FILE" --dir /tmp/snapshot; then
            python src/warehouse_snapshot.py restore "/tmp/snapshot/$SNAPSHOT_FILE"
          else
            echo "::notice::No snapshot yet: the sync will backfill from Fingrid."
          fi

      # FMI serves only today's forecasts, so yesterday's archive is restored and today's issue added.
      - name: Restore the weather forecast archive
        run: |
          if gh release download "$SNAPSHOT_TAG" --pattern "$FORECAST_ARCHIVE" --dir /tmp/snapshot; then
            python src/fmi_forecast.py restore "/tmp/snapshot/$FORECAST_ARCHIVE"
          else
            echo "::notice::No forecast archive yet: it starts with today's issue."
          fi

      - name: Archive today's FMI weather forecasts
        run: python src/fmi_forecast.py fetch

      # Two-day-old forecasts for every hour since the warehouse began (backfills on the first run).
      # They live in the same weather_forecast table, so the archive asset keeps them too.
      - name: Archive Open-Meteo forecasts made two days ahead
        run: python src/openmeteo_forecast.py fetch

      # Reservoir levels, river flow and snow since 2000 (SYKE, NVE): restored, then the last two weeks
      # re-fetched (SYKE revises recent values). Without an archive the first run fetches all of it (~3 min).
      - name: Restore and update the hydrology archive
        run: |
          if gh release download "$SNAPSHOT_TAG" --pattern "$HYDROLOGY_ARCHIVE" --dir /tmp/snapshot; then
            python src/hydrology.py restore "/tmp/snapshot/$HYDROLOGY_ARCHIVE"
          else
            echo "::notice::No hydrology archive yet: fetching the full history."
          fi
          python src/hydrology.py fetch

      # Day-ahead prices for Finland and the zones it is connected to (ENTSO-E Transparency Platform,
      # secret ENTSOE_TOKEN). Restored, then re-fetched from three days before the newest price up to
      # tomorrow's. ENTSO-E being down or the token expiring warns here but does not stop the Fingrid refresh.
      - name: Restore and update the ENTSO-E price archive
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          if gh release download "$SNAPSHOT_TAG" --pattern "$PRICE_ARCHIVE" --dir /tmp/snapshot; then
            python src/entsoe_prices.py restore "/tmp/snapshot/$PRICE_ARCHIVE"
          else
            echo "::notice::No price archive yet: fetching prices from November 2023."
          fi
          python src/entsoe_prices.py fetch || { echo "::warning::ENTSO-E prices were not updated."; exit 1; }

      # Ember's monthly European prices and generation (CC BY 4.0, no key; about 5 MB). Ember keeps the
      # history, so it is fetched fresh, not archived; if it fails, the export keeps the published europe.json.
      - name: Fetch Ember's European electricity data
        continue-on-error: true
        run: python src/ember.py fetch || { echo "::warning::Ember data was not fetched."; exit 1; }

      # history_from reaches the script only through the environment (no script injection),
      # and argparse accepts nothing but a YYYY-MM-DD date.
      - name: Sync from Fingrid
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          HISTORY_FROM: ${{ inputs.history_from }}
        run: |
          if [ -n "$HISTORY_FROM" ]; then
            python src/sync_fingrid.py --from "$HISTORY_FROM"
          else
            python src/sync_fingrid.py
          fi

      # Only main publishes: a test run of a PR branch must not replace the snapshot main restores.
      - name: Publish the new snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          python src/warehouse_snapshot.py dump "/tmp/$SNAPSHOT_FILE"
          if ! gh release view "$SNAPSHOT_TAG" > /dev/null 2>&1; then
            gh release create "$SNAPSHOT_TAG" --latest=false \
              --title "Fingrid warehouse snapshot" \
              --notes "Every row of fingrid_observation as CSV (dataset_id, start_time, end_time, value), replaced daily by .github/workflows/refresh_fingrid.yml. Source: Fingrid Open Data, CC BY 4.0 (https://data.fingrid.fi)."
          fi
          gh release upload "$SNAPSHOT_TAG" "/tmp/$SNAPSHOT_FILE" --clobber
          python src/fmi_forecast.py dump "/tmp/$FORECAST_ARCHIVE"
          gh release upload "$SNAPSHOT_TAG" "/tmp/$FORECAST_ARCHIVE" --clobber
          python src/hydrology.py dump "/tmp/$HYDROLOGY_ARCHIVE"
          gh release upload "$SNAPSHOT_TAG" "/tmp/$HYDROLOGY_ARCHIVE" --clobber
          python src/entsoe_prices.py dump "/tmp/$PRICE_ARCHIVE"     # writes nothing when no price is stored
          if [ -s "/tmp/$PRICE_ARCHIVE" ]; then
            gh release upload "$SNAPSHOT_TAG" "/tmp/$PRICE_ARCHIVE" --clobber
          fi

      - name: Build the dashboard data
        run: python scripts/export_dashboard_data.py      # every part in DAILY_PARTS

      # Off main (a test run of a PR branch), keep the files as a run artifact instead of
      # committing: a bot commit on a PR branch leaves its CI waiting for manual approval.
      - name: Keep the data as an artifact (test runs off main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: docs/data/*.json

      - name: Commit if the data changed
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          git add docs/data      # fingrid_latest.json is git-ignored; the rest is what the export wrote
          if git diff --cached --quiet; then
            echo "No change in the dashboard data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Fingrid dashboard data ($(date -u +%Y-%m-%d))"
            # A long run (a history fill takes hours) can see main move under it: replay on top, once.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: gh workflow run pages.yml --ref main

  keepalive:
    needs: refresh
    if: always()               # also when the refresh failed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # includes the commit the refresh job may just have pushed

      - name: Push an empty commit if main has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit on main: ${age_days} days ago."
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled workflows active (no commit for ${age_days} days)"
            git push
          fi
