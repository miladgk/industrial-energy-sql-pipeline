name: Refresh the Fingrid warehouse and dashboard data

# Once a day:
#   1. start an empty PostgreSQL and restore yesterday's warehouse snapshot
#      (release "warehouse-snapshot", asset fingrid_observation.csv.gz)
#   2. sync from Fingrid: only the last 7 days per dataset (Fingrid revises
#      recent values); with no snapshot it backfills 400 days instead
#   3. publish the new snapshot, so the next run starts from it
#   4. run the SQL analyses and write docs/data/fingrid_recent_daily.json,
#      forecast_scorecard.json and co2_forecast.json; commit them if they
#      changed and redeploy GitHub Pages
#
# It runs at 10:47 UTC because Fingrid publishes the next day's day-ahead
# forecasts at 12:00 Finnish time (10:00 UTC in winter, 09:00 UTC in summer),
# and the CO2 forecast for tomorrow is built from them.
#
# Requires the repository secret FINGRID_API_KEY
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# The key is only used inside this job; it is never written to the repository
# or sent to the browser.
#
# The newest values (updated every hour) come from pages.yml instead.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. The daily data commit normally counts as that
# activity; the keepalive job covers the case where the refresh keeps failing
# (for example an expired key), so the hourly and daily schedules stay on while
# the failure emails keep arriving.

on:
  schedule:
    - cron: "47 10 * * *"    # every day 10:47 UTC, after Fingrid's 12:00 Finnish-time publication
  workflow_dispatch:

permissions:
  contents: write            # commit the refreshed JSON and publish the snapshot release asset
  actions: write             # start the Pages deploy (pushes made with GITHUB_TOKEN do not trigger workflows)

concurrency:
  group: refresh-fingrid
  cancel-in-progress: false

env:
  SNAPSHOT_TAG: warehouse-snapshot
  SNAPSHOT_FILE: fingrid_observation.csv.gz

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45      # a full backfill (no snapshot) takes about 15 minutes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: energy_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d energy_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/energy_analytics
      DATABASE_SSLMODE: disable
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check that the API key secret exists
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: |
          if [ -z "$FINGRID_API_KEY" ]; then
            echo "::error::Repository secret FINGRID_API_KEY is not set."
            exit 1
          fi

      - name: Create the schema
        run: python src/setup_db.py

      - name: Restore the previous warehouse snapshot
        run: |
          if gh release download "$SNAPSHOT_TAG" --pattern "$SNAPSHOT_FILE" --dir /tmp/snapshot; then
            python src/warehouse_snapshot.py restore "/tmp/snapshot/$SNAPSHOT_FILE"
          else
            echo "::notice::No snapshot yet: the sync will backfill from Fingrid."
          fi

      - name: Sync from Fingrid
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: python src/sync_fingrid.py

      - name: Publish the new snapshot
        run: |
          python src/warehouse_snapshot.py dump "/tmp/$SNAPSHOT_FILE"
          if ! gh release view "$SNAPSHOT_TAG" > /dev/null 2>&1; then
            gh release create "$SNAPSHOT_TAG" --latest=false \
              --title "Fingrid warehouse snapshot" \
              --notes "Every row of fingrid_observation as CSV (dataset_id, start_time, end_time, value), replaced daily by .github/workflows/refresh_fingrid.yml. Source: Fingrid Open Data, CC BY 4.0 (https://data.fingrid.fi)."
          fi
          gh release upload "$SNAPSHOT_TAG" "/tmp/$SNAPSHOT_FILE" --clobber

      - name: Build the dashboard data
        run: python scripts/export_dashboard_data.py --parts fingrid-recent forecast-scorecard co2-forecast

      - name: Commit if the data changed
        id: commit
        run: |
          files="docs/data/fingrid_recent_daily.json docs/data/forecast_scorecard.json docs/data/co2_forecast.json"
          git add $files
          if git diff --cached --quiet; then
            echo "No change in the dashboard data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Fingrid dashboard data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: gh workflow run pages.yml --ref main

  keepalive:
    needs: refresh
    if: always()               # also when the refresh failed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # includes the commit the refresh job may just have pushed

      - name: Push an empty commit if main has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit on main: ${age_days} days ago."
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled workflows active (no commit for ${age_days} days)"
            git push
          fi
