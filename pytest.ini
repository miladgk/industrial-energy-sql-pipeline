[pytest]
testpaths = tests
markers =
    smoke: fast sanity checks (is the system alive at all?). Run first: pytest -m smoke
    api: HTTP contract tests for the FastAPI endpoints
    integration: tests that exercise several components together against a real PostgreSQL
    regression: golden-dataset tests that pin known outputs so unintended changes are caught
    security: runtime security checks (injection, error leakage, secrets, read-only API)
    performance: query-plan checks (index use, partition pruning) and generous latency budgets
    e2e: browser tests of the dashboard against the real API and database (needs playwright)
