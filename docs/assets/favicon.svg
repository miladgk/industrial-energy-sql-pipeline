<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>Grid in SQL · Finland's Living Energy Observatory</title>
  <defs>
    <clipPath id="tileClip">
      <rect x="1" y="1" width="62" height="62" rx="15" />
    </clipPath>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="55%" stop-color="#070c17" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="52%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.22" />
    </linearGradient>
  </defs>

  <!-- Obsidian & Aurora Spatial Tile -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#obsidianBg)" />

  <g clip-path="url(#tileClip)">
    <!-- Ambient Aurora Light Pools -->
    <circle cx="14" cy="12" r="24" fill="#10b981" fill-opacity="0.22" />
    <circle cx="52" cy="52" r="26" fill="#38bdf8" fill-opacity="0.22" />
    <circle cx="48" cy="14" r="18" fill="#818cf8" fill-opacity="0.14" />

    <!-- Subtle SQL Partition & Nordic Reticle Grid -->
    <g stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1.2">
      <line x1="8" y1="22" x2="56" y2="22" />
      <line x1="8" y1="34" x2="56" y2="34" />
      <line x1="8" y1="46" x2="56" y2="46" />
      <line x1="24" y1="8" x2="24" y2="56" stroke="#38bdf8" stroke-opacity="0.22" />
    </g>

    <!-- Conformal Uncertainty Ribbon -->
    <path
      d="M 9 37 L 20 30 L 29 39 L 39 13 L 46 27 L 55 20 L 55 31 L 46 39 L 39 27 L 29 50 L 20 42 L 9 45 Z"
      fill="url(#bandGrad)"
    />

    <!-- Living 50 Hz Grid Waveform (Outer Glow + Crisp Core) -->
    <path
      d="M 9 41 L 20 35.5 L 29 44.5 L 39 19 L 46 33 L 55 25.5"
      fill="none"
      stroke="url(#waveGrad)"
      stroke-width="8"
      stroke-opacity="0.24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 9 41 L 20 35.5 L 29 44.5 L 39 19 L 46 33 L 55 25.5"
      fill="none"
      stroke="url(#waveGrad)"
      stroke-width="4.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Peak Telemetry Node -->
    <circle cx="39" cy="19" r="6.5" fill="#38bdf8" fill-opacity="0.26" />
    <circle cx="39" cy="19" r="3.8" fill="#10b981" stroke="#f8fafc" stroke-width="1.8" />
  </g>

  <!-- Crisp Specular Glass Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#glassRim)" stroke-width="1.5" />
</svg>
